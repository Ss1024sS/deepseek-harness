# FDE aggregate-only review sidecar. This composition deliberately has no
# filesystem, shell, subprocess, terminal, MCP, subagent, workflow, job tool,
# web, telemetry, or live network model provider.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: false

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: |-
      你是 FDE 汇总审核助手。输入只允许是 effiengine.fde-harness-aggregate-facts 的 canonical JSON。
      只根据汇总指标给出审核建议，不补造客户、人员、物料、订单、金额或原始明细。
      输出必须符合 effiengine.fde-harness-advice；你没有任何工具，也没有业务写入权。
    workspaceContext: false
    dshHome: !!js process.env.FDE_SIDECAR_SESSION_ROOT
    maxParallelToolCalls: 1
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    goals: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.FDE_SIDECAR_SESSION_ROOT
    compression: none
    packChunks: false
    writeBatchMaxDelayMs: 1

# Persistence owns storage; this policy makes completed requests and steps
# explicit durability checkpoints before the one-shot runtime shuts down.
- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: llm-replay
  name: '@deepseek-ai/dsh-llm-replay'
  config:
    file: !!js process.env.FDE_SIDECAR_REPLAY_FILE
    overrideFile: !!js process.env.FDE_SIDECAR_REPLAY_OVERRIDE
    providers:
      - id: fde-replay
        name: FDE keyless replay
        models:
          - id: aggregate-review-v1
            contextWindow: 8192
            inputModalities:
              - text
